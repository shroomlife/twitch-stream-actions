name: Build and Bundle

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-zip:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Set up Bun
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      # Create .env file with variables and secrets
      - name: Create .env file
        run: |
          echo "VITE_API_URL=${{ vars.VITE_API_URL }}" >> .env
          echo "VITE_GIPHY_API_KEY=${{ secrets.VITE_GIPHY_API_KEY }}" >> .env

      # Install dependencies
      - name: Install dependencies
        run: bun install

      # The service tests gate the image and the ZIP
      - name: Test the service
        run: bun test service

      # Build the project
      - name: Build the project
        run: bun run build

      # Build and push the backend image; stage-dist from the build above is part of its context
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push stream-actions image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: service/Dockerfile
          push: true
          tags: shroomlife/stream-actions:${{ github.sha }}

      # Create ZIP file
      - name: Create ZIP file
        run: bun run bundle.ts

      # Upload the artifact
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twitch-extension-zip
          path: 'twitch-extension-*.zip'
